<!doctype html><html><head><meta charset="utf-8"><title>Bamboo panda studio</title><style>body{margin:0;background:#eee8df;color:#514b42;text-align:center;font:15px system-ui}h1{font-size:23px;margin:20px 0 4px}#pet{width:360px;height:360px;margin:auto}button,select{font:inherit;border:0;border-radius:16px;background:#d5dfbe;color:#414d33;padding:9px 14px;margin:4px;cursor:pointer}input{display:block;margin:12px auto;width:300px;padding:12px;border:0;border-radius:18px}#quote{min-height:24px}p{margin:10px}</style></head><body><h1>Bamboo panda</h1><p>A seated companion · gentle blinking · bamboo breaks</p><div id="pet"></div><input id="search" placeholder="Ask Something"><div><button id="water">Water</button><button id="snack">Bamboo</button><button id="play">Leaf play</button><button id="blink">Blink</button></div><div><button id="sit">Sit / wake</button><button id="sleep">Sleep</button><button id="celebrate">Celebrate</button><select id="personality"><option value="calm">Calm</option><option value="playful">Playful</option><option value="sleepy">Sleepy</option></select></div><div><button id="mode">Try standing / walking</button><button id="walkCycle">Walk</button><button id="runCycle">Run</button><button id="standPose">Stand</button><button id="pickup">Pick up</button><button id="putDown">Set down</button><button id="faceLeft">Face left</button><button id="faceRight">Face right</button></div><p id="quote" role="status"></p><p id="status">Loading offline…</p><script src="../src/companion-life.js"></script><script src="../src/companion-rest.js"></script><script src="../src/companion-idle.js"></script><script src="../src/panda.js"></script><script>
const pet=document.getElementById('pet'),search=document.getElementById('search');let preview,roamingPreview=new URLSearchParams(location.search).get('mode')==='roaming';
function mount(){document.getElementById('mode').textContent=roamingPreview?'Back to seated preview':'Try standing / walking';for(const id of ['walkCycle','runCycle','standPose','pickup','putDown','faceLeft','faceRight'])document.getElementById(id).disabled=!roamingPreview;preview=Panda.mount(pet,{input:search,roaming:roamingPreview});preview.ready.then(ok=>document.getElementById('status').textContent=ok?'Ready · seated and walking poses':'Panda unavailable');}
document.getElementById('mode').onclick=()=>{preview.destroy();roamingPreview=!roamingPreview;mount();};
for(const [id,action] of [['walkCycle',()=>preview.setLocomotion('walk',40)],['runCycle',()=>preview.setLocomotion('run',100)],['standPose',()=>{preview.setLocomotion('idle');preview.wake();}],['pickup',()=>preview.pickUp()],['putDown',()=>preview.releasePickup()],['faceLeft',()=>preview.setHeading(-1,0)],['faceRight',()=>preview.setHeading(1,0)]])document.getElementById(id).onclick=action;
mount();for(const id of ['water','snack'])document.getElementById(id).onclick=()=>preview.giveCare(id);for(const id of ['play','blink','sit','sleep'])document.getElementById(id).onclick=()=>preview[id]();document.getElementById('celebrate').onclick=()=>preview.searchCompleted();document.getElementById('personality').onchange=e=>preview.setPersonality(e.target.value);
for(const type of ['companion-bubble','cat-yarn-complete','cat-manual-care-complete'])pet.addEventListener(type,e=>document.getElementById('quote').textContent=e.detail.message);pet.addEventListener('cat-yarn-quote-clear',()=>document.getElementById('quote').textContent='');pet.addEventListener('character-retry',()=>{preview.destroy();mount();});window.addEventListener('beforeunload',()=>preview.destroy());
</script></body></html>
