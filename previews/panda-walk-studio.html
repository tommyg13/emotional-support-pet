<!doctype html><html><head><meta charset="utf-8"><title>Panda walking preview</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee8df;color:#514b42;font:15px system-ui}#controls{position:absolute;top:16px;left:18px;right:18px;z-index:2}button{font:inherit;margin:3px;border:0;border-radius:16px;background:#d5dfbe;color:#414d33;padding:9px 14px;cursor:pointer}#hint{margin:12px 4px}#leaf{position:absolute;width:34px;height:34px;pointer-events:none;transform:translate(-50%,-50%)}#leaf[hidden]{display:none}</style></head><body><div id="controls"><button id="home">Run home</button><button id="sit">Sit</button><button id="sleep">Sleep</button><button id="wake">Wake</button><button id="jump">Jump</button><button id="speed">Speed up</button><button id="chase">Chase leaf</button><p id="hint">Loading panda…</p></div><div id="leaf" hidden></div><script src="../src/companion-life.js"></script><script src="../src/companion-rest.js"></script><script src="../src/companion-idle.js"></script><script src="../src/companion-swing.js"></script><script src="../src/panda.js"></script><script src="../src/roaming-dog.js"></script><script src="../src/search-character.js"></script><script>
let chaseEpoch=0,fast=false;const leaf=document.getElementById('leaf');leaf.innerHTML=Panda.toyIcon;
function stopChase(){chaseEpoch++;leaf.hidden=true;}
function home(){stopChase();return companion.runTo(innerWidth*.6,innerHeight*.82);}
const companion=SearchCharacters.mount('panda','roaming',document.body,{x:innerWidth*.6,y:innerHeight*.82,onClick:home,onHeld:held=>{if(held)stopChase();}});
companion.ready.then(ok=>document.getElementById('hint').textContent=ok?'Click the background to walk · drag the panda to pick it up · click the panda to run home':'Panda unavailable');
document.addEventListener('click',e=>{if(e.target.closest('button')||companion.element.contains(e.target))return;stopChase();companion.walkTo(e.clientX,e.clientY);});
document.getElementById('home').onclick=home;for(const id of ['sit','sleep','wake','jump'])document.getElementById(id).onclick=()=>{stopChase();companion[id]();};
document.getElementById('speed').onclick=e=>{fast=!fast;companion.setSpeed(fast?1.8:1);e.target.textContent=fast?'Normal speed':'Speed up';};
document.getElementById('chase').onclick=async()=>{stopChase();const epoch=chaseEpoch;for(let i=0;i<3&&epoch===chaseEpoch;i++){const x=110+Math.random()*Math.max(1,innerWidth-220),y=210+Math.random()*Math.max(1,innerHeight-240);leaf.style.left=x+'px';leaf.style.top=y+'px';leaf.hidden=false;if(!await companion.runTo(x,y))break;}if(epoch===chaseEpoch)leaf.hidden=true;};
window.addEventListener('beforeunload',()=>{stopChase();companion.destroy();});
</script></body></html>
