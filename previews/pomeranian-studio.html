<!doctype html><html><head><meta charset="utf-8"><title>Pomeranian character preview</title><style>
body{margin:0;background:#f4ebe4;color:#644c42;font:15px system-ui;text-align:center}h1{font-size:22px;margin:22px 0 6px}p{margin:8px}#pet{width:360px;height:360px;margin:auto}button{border:0;padding:9px 14px;margin:4px;border-radius:16px;background:#e2c5b7;color:#51392f;cursor:pointer}input{display:block;width:300px;padding:12px;border:0;border-radius:18px;margin:10px auto}#status{font-size:13px}</style></head><body><h1>Pomeranian · 3D preview</h1><p>Move your pointer to guide the puppy’s head. Type to get a curious glance.<br>Hold Water or Bone treat, then bring it to the mouth.</p><div id="pet"></div><input id="search" placeholder="Ask Something"><div><button id="water">Water</button><button id="food">Bone treat</button><button id="play">Ball</button><button id="celebrate">Search completed</button></div><p id="status">Loading locally…</p><p id="careQuote" role="status" aria-live="polite"></p><div><button id="curious">Head turns</button><button id="tilt">Head tilt</button><button id="wag">Tail wag</button><button id="idleGlance" title="Test a quiet glance when the puppy is free">Idle glance</button><button id="welcome" title="Test a welcome-back greeting when the puppy is free">Welcome back</button></div><div><button data-view="angle">3/4 view</button><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="rear">Back</button></div><div><button id="walkCycle">Walk cycle</button><button id="trotCycle">Trot cycle</button><button id="stand">Stand / wake</button><button id="sitPose">Sit</button><button id="sleepPose">Sleep</button><button id="faceLeft">Face left</button><button id="faceRight">Face right</button></div><p>Head, tail and four-leg rig · sleep uses a relaxed lying pose; closed eyelids and jaw animation come later.</p><script src="../src/companion-rest.js"></script><script src="../src/companion-idle.js"></script><script src="../src/companion-ball.js"></script><script src="../src/pomeranian.js"></script><script src="../src/search-character.js"></script><script>
let preview;
function mountPreview(){
  preview?.destroy();
  const current=preview=SearchCharacters.mount('pomeranian','docked',document.getElementById('pet'),{input:document.getElementById('search')});
  document.getElementById('status').textContent='Loading locally…';
  current.ready.then(ok=>{if(current===preview)document.getElementById('status').textContent=ok?'Ready · animated head and tail · all assets loaded offline':'Could not load the puppy. Retry above or choose the cat in Settings.';});
}
mountPreview();
document.getElementById('pet').addEventListener('character-retry',mountPreview);
walkCycle.onclick=()=>preview.renderer.setLocomotion('walk',60);trotCycle.onclick=()=>preview.renderer.setLocomotion('run',120);stand.onclick=()=>{preview.renderer.setLocomotion('idle');preview.wake();};sitPose.onclick=()=>{preview.renderer.setLocomotion('idle');preview.sit();};sleepPose.onclick=()=>{preview.renderer.setLocomotion('idle');preview.sleep();};faceLeft.onclick=()=>preview.renderer.setHeading(-1,0);faceRight.onclick=()=>preview.renderer.setHeading(1,0);
water.onclick=()=>preview.giveCare('water');food.onclick=()=>preview.giveCare('snack');play.onclick=()=>preview.play();celebrate.onclick=()=>preview.searchCompleted();
curious.onclick=()=>preview.react('curious');tilt.onclick=()=>preview.react('tilt');wag.onclick=()=>preview.react('wag');idleGlance.onclick=()=>preview.react('idle');welcome.onclick=()=>preview.react('welcome');
for(const button of document.querySelectorAll('[data-view]'))button.onclick=()=>preview.renderer.setView(button.dataset.view);
window.addEventListener('beforeunload',()=>preview.destroy());
</script><script src="pomeranian-care-demo.js"></script></body></html>
