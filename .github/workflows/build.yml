name: Build and release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare one draft release before any uploads
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Check application behavior
        run: node --test
      - run: npx electron-builder --config electron-builder.config.js --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish Windows installer and updater metadata
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' })
          if (-not (Test-Path dist/latest.yml) -or -not ($assets | Where-Object { $_.Extension -eq '.exe' })) { throw 'Windows update assets missing' }
          foreach ($asset in $assets) {
            $publicName = $asset.Name.Replace(' ', '-')
            if ($asset.Name -ne $publicName) { Rename-Item -LiteralPath $asset.FullName -NewName $publicName }
            $uploadPath = Join-Path $asset.DirectoryName $publicName
            gh release upload $env:GITHUB_REF_NAME $uploadPath --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release upload failed: $($asset.Name)" }
          }
      - name: Verify macOS signatures
        if: runner.os == 'macOS'
        run: |
          find dist -maxdepth 2 -name '*.app' -print -exec codesign --verify --deep --strict --verbose=2 {} \;
          for app in dist/mac*/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app" || exit 1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.yml
            dist/*.blockmap

  publish-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Publish after both platform builds succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false
