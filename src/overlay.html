<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; pointer-events: none; }
  #stage {
    position: fixed; bottom: 0; left: 50%;
    height: min(72vh, 90vw); aspect-ratio: 1;
    margin-left: calc(min(72vh, 90vw) / -2);
    transform: translateY(125%);
    filter: drop-shadow(0 12px 24px rgba(0,0,0,.28));
  }
  #bob, .char { width: 100%; height: 100%; }
  .char svg, .char img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .heart { position: fixed; bottom: 45vh; opacity: 0; }
</style>
</head>
<body>
<div id="stage"><div id="bob"><div class="char" id="char"></div></div></div>
<script src="../node_modules/lottie-web/build/player/lottie.min.js"></script>
<script src="characters.js"></script>
<script>
  const stage = document.getElementById('stage');
  const bob = document.getElementById('bob');
  const charEl = document.getElementById('char');
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  async function resolveCharacter(id) {
    const all = [...Characters.builtin, ...(await api.listCustom())];
    if (id === 'random') return all[Math.floor(Math.random() * all.length)];
    return all.find((c) => c.id === id) || Characters.builtin[0];
  }

  function hearts() {
    const set = ['💗', '💖', '💕'];
    for (let i = 0; i < 9; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = set[i % 3];
      h.style.left = 25 + Math.random() * 50 + 'vw';
      h.style.fontSize = 28 + Math.random() * 30 + 'px';
      const rise = 30 + Math.random() * 30;
      h.animate(
        [
          { transform: 'translateY(0) scale(.6)', opacity: 0 },
          { opacity: 1, offset: 0.2 },
          { transform: `translateY(-${rise}vh) scale(1.1)`, opacity: 0 },
        ],
        { duration: 2200 + Math.random() * 1200, delay: 500 + i * 200, easing: 'ease-out', fill: 'both' }
      ).onfinish = () => h.remove();
      document.body.appendChild(h);
    }
  }

  api.onPlay(async ({ characterId, duration }) => {
    try {
      const ch = await resolveCharacter(characterId);
      Characters.render(charEl, ch);
      await wait(120); // let images/svg paint before sliding in

      // peek up
      await stage.animate(
        [
          { transform: 'translateY(125%) rotate(-5deg)' },
          { transform: 'translateY(-3%) rotate(2deg)', offset: 0.7 },
          { transform: 'translateY(0) rotate(0deg)' },
        ],
        { duration: 750, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'forwards' }
      ).finished;

      // gentle bounce while visible
      const b = bob.animate(
        [{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(-1.5%) scale(1.02)' }],
        { duration: 700, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' }
      );
      hearts();
      await wait(duration * 1000);
      b.cancel();

      // slide down
      await stage.animate(
        [{ transform: 'translateY(0)' }, { transform: 'translateY(125%)' }],
        { duration: 550, easing: 'cubic-bezier(.5,0,.8,.4)', fill: 'forwards' }
      ).finished;
    } finally {
      charEl.innerHTML = '';
      api.overlayDone();
    }
  });
</script>
</body>
</html>
