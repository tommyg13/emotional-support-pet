<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    }

    #wrap {
      position: relative;
      width: 560px;
      height: 270px;
      -webkit-app-region: no-drag;
      user-select: none;
    }

    #cat {
      position: absolute;
      right: 44px;
      bottom: 88px;
      height: 190px;
      width: 157px;
      z-index: 2;
      pointer-events: auto;
      filter: drop-shadow(0 6px 10px rgba(60, 40, 30, .25));
    }

    #cat svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    #care { position:absolute; left:36px; bottom:100px; display:flex; gap:16px; z-index:3; }
    .care-button { width:74px; height:82px; border:1px solid #fff8; border-radius:22px; background:linear-gradient(155deg,#fff8ee,#efdfd6); color:#6b5147; box-shadow:0 5px 12px #583b3226; cursor:pointer; font-family:inherit; font-size:11px; font-weight:600; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; -webkit-app-region:no-drag; }
    .care-button svg { width:50px; height:50px; pointer-events:none; }
    .care-button:hover { background:#fff5e9; }
    .care-button:active { background:#ecd5c7; }
    .care-button:focus-visible { outline:3px solid #ff5c8acc; outline-offset:3px; }
    #careBubble { position:absolute; left:32px; top:20px; width:236px; box-sizing:border-box; padding:12px 16px; border-radius:20px; background:#fff5e9; color:#705145; border:1px solid #eacbc0; box-shadow:0 4px 14px #583b3220; z-index:4; font-size:13px; line-height:1.4; pointer-events:none; }
    #careBubble::after { content:""; position:absolute; right:-9px; bottom:14px; width:14px; height:14px; background:#fff5e9; border-right:1px solid #eacbc0; border-top:1px solid #eacbc0; transform:rotate(45deg); }
    #careBubble[hidden] { display:none; }

    #bar {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      height: 72px;
      z-index: 1;
      border-radius: 36px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px 0 30px;
      background: linear-gradient(180deg, #d9cac2, #e8dbd2);
      box-shadow: 0 8px 24px rgba(90, 60, 50, .28), inset 0 1px 2px rgba(255, 255, 255, .55);
    }

    input {
      -webkit-app-region: no-drag;
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      font-family: inherit;
      font-size: 24px;
      font-weight: 500;
      color: #4a3a36;
    }

    input::placeholder {
      color: rgba(255, 255, 255, .95);
      text-shadow: 0 1px 2px rgba(90, 60, 50, .25);
    }

    #go {
      -webkit-app-region: no-drag;
      background: none;
      border: 0;
      cursor: pointer;
      padding: 8px;
      border-radius: 12px;
    }

    #go:hover {
      background: rgba(255, 255, 255, .3);
    }

    #go:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(255, 92, 138, .8);
      outline-offset: 2px;
    }

    #go svg {
      width: 32px;
      height: 32px;
      display: block;
    }
    #aiToggle { border:0; border-radius:16px; padding:9px; cursor:pointer; color:#59433c; background:#ffffff70; white-space:nowrap; }
    #aiToggle[aria-pressed=true] { background:#ff5c8a; color:white; }
    #chat { position:absolute; top:270px; left:16px; right:16px; bottom:8px; background:#fff7f2; color:#3a2a2a; border-radius:20px; padding:14px; box-sizing:border-box; display:flex; flex-direction:column; box-shadow:0 4px 18px #5433; }
    #chat[hidden] { display:none; }
    #chat header { display:flex; gap:8px; align-items:center; }
    #chat header strong { flex:1; }
    #chat button { border:0; border-radius:10px; padding:6px 9px; cursor:pointer; background:#eeddd5; color:#3a2a2a; }
    #messages { flex:1; overflow:auto; user-select:text; padding:8px 0; }
    .message { white-space:pre-wrap; overflow-wrap:anywhere; margin:7px 0; padding:9px 12px; border-radius:12px; background:#f0e3dc; font-size:14px; }
    .message.user { background:#ffe0e9; margin-left:35px; }
    .message.error { color:#9a243f; }
    #usage, #chatStatus { font-size:12px; color:#806b64; }
  </style>
</head>

<body>
  <div id="wrap">
    <div id="cat"></div>
    <div id="care" role="group" aria-label="Care for your cat">
      <button id="giveWater" class="care-button" type="button" aria-label="Give the cat water" title="Give water"><span>Water</span></button>
      <button id="giveSnack" class="care-button" type="button" aria-label="Give the cat a fish treat" title="Give a fish treat"><span>Fish treat</span></button>
    </div>
    <div id="careBubble" role="status" aria-live="polite" hidden>So happy… but I’m full! Let’s paws for a moment. ♡</div>
    <div id="bar">
      <input id="q" type="text" placeholder="What you want to ask?" autocomplete="off" spellcheck="false">
      <button id="go" title="Search (Enter)" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M20 5v6a2 2 0 0 1-2 2H5" />
          <path d="M9 8l-4 5 4 5" />
        </svg>
      </button>
      <button id="aiToggle" aria-pressed="false" title="Turn AI chat on or off">AI OFF</button>
    </div>
  </div>
  <section id="chat" hidden aria-label="AI conversation">
    <header><strong id="chatTitle">AI chat</strong><button id="aiSettings">Settings</button><button id="newChat">New chat</button><button id="closeChat" aria-label="Close conversation">×</button></header>
    <div id="messages" role="log" aria-live="polite"></div>
    <div id="chatStatus" role="status"></div><div id="usage">Tokens appear after a reply.</div>
  </section>
  <script src="typing-cat.js"></script>
  <script>
    const input = document.getElementById('q');
    const catController = TypingCat.mount(document.getElementById('cat'), input);
    for (const [id, kind] of [['giveWater', 'water'], ['giveSnack', 'snack']]) {
      const button = document.getElementById(id);
      button.insertAdjacentHTML('afterbegin', TypingCat.careIcons[kind]);
      button.addEventListener('click', () => catController.giveCare(kind));
    }
    document.getElementById('cat').addEventListener('cat-care-full', e => {
      document.getElementById('careBubble').hidden = !e.detail.full;
    });
    window.addEventListener('beforeunload', () => catController.destroy());
    api.getSettings().then(s => catController.setPersonality(s.catPersonality || 'calm')).catch(() => {});
    api.onCatPersonality(value => catController.setPersonality(value));
    api.onDevCatAction((action, value) => window.dispatchEvent(new CustomEvent(action === 'mood' ? 'cat-dev-mood' : 'cat-dev-wave', { detail: value }))); 

    // Explicit capture gives the animation reliable press/release state during window dragging.
    const wrap = document.getElementById('wrap');
    let drag = null;
    function endDrag(e) {
      if (!drag) return;
      const id = drag.id;
      drag = null;
      if (wrap.hasPointerCapture(id)) wrap.releasePointerCapture(id);
      api.dockDragEnd();
      window.dispatchEvent(new CustomEvent('cat-drag', { detail: false }));
    }
    wrap.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || e.target.closest('input, button')) return;
      drag = { id: e.pointerId, x: e.screenX, y: e.screenY };
      wrap.setPointerCapture(e.pointerId);
      window.dispatchEvent(new CustomEvent('cat-drag', { detail: true }));
      api.dockDragStart();
      e.preventDefault();
    });
    wrap.addEventListener('pointermove', (e) => {
      if (drag && e.pointerId === drag.id) api.dockDragMove(e.screenX - drag.x, e.screenY - drag.y);
    });
    wrap.addEventListener('pointerup', endDrag);
    wrap.addEventListener('pointercancel', endDrag);
    wrap.addEventListener('lostpointercapture', endDrag);
    window.addEventListener('blur', endDrag);

    let enabled = false, busy = false, provider = '', activeModel = '', history = [], totalTokens = 0;
    const panel = document.getElementById('chat'), toggle = document.getElementById('aiToggle');
    async function showPanel(open) { panel.hidden = !open; await api.aiPanel(open); }
    function message(role, text) {
      const el = document.createElement('div'); el.className = 'message ' + role; el.textContent = text;
      document.getElementById('messages').appendChild(el); el.scrollIntoView({ block:'end' });
    }
    async function refresh() {
      const s = await api.getSettings();
      const nextModel = s.aiModels?.[s.aiProvider] || '';
      if (provider && (provider !== s.aiProvider || activeModel !== nextModel)) reset();
      activeModel = nextModel;
      provider = s.aiProvider || 'openai'; enabled = !!s.aiEnabled;
      toggle.textContent = enabled ? 'AI ON' : 'AI OFF'; toggle.setAttribute('aria-pressed', String(enabled));
      document.getElementById('chatTitle').textContent = 'AI chat · ' + ({openai:'OpenAI',claude:'Claude',google:'Google Gemini'}[provider]);
      input.placeholder = enabled ? 'Ask AI…' : 'What you want to ask?';
      if (!enabled && !panel.hidden) await showPanel(false);
    }
    function reset() { history = []; totalTokens = 0; document.getElementById('messages').replaceChildren(); document.getElementById('usage').textContent = 'Tokens appear after a reply.'; document.getElementById('chatStatus').textContent = ''; }
    toggle.onclick = async () => {
      if (busy) return;
      await api.setSettings({ aiEnabled: !enabled }); await refresh();
      if (enabled && !(await api.aiStatus(provider)).configured) {
        await showPanel(true); document.getElementById('chatStatus').textContent = 'Choose a provider, save your API key and select an official model in Settings.';
      }
    };
    document.getElementById('aiSettings').onclick = () => api.openSettings();
    document.getElementById('newChat').onclick = () => { if (!busy) reset(); };
    document.getElementById('closeChat').onclick = () => showPanel(false);
    window.addEventListener('focus', () => { if (!busy) refresh(); });
    refresh();
    async function submit() {
      const q = input.value.trim(); if (!q || busy) return;
      await refresh();
      if (!enabled) { api.searchSubmit(q); input.value = ''; catController.searchCompleted(); return; }
      await showPanel(true);
      if (!(await api.aiStatus(provider)).configured || !activeModel) {
        document.getElementById('chatStatus').textContent = 'Choose a provider, save your API key and select an official model in Settings.'; return;
      }
      if (q.length > 30000 || history.length >= 98) { document.getElementById('chatStatus').textContent = 'Message or conversation too long. Start a new chat.'; return; }
      busy = true; document.getElementById('go').disabled = true; toggle.disabled = true;
      document.getElementById('newChat').disabled = true; input.value = ''; catController.queryReset(); message('user', q);
      document.getElementById('chatStatus').textContent = 'Thinking…';
      const messages = [...history, {role:'user', content:q}];
      try {
        const reply = await api.aiChat(messages);
        history = [...messages, {role:'assistant',content:reply.text}]; message('assistant', reply.text);
        catController.searchCompleted();
        const u = reply.usage; if (u.total != null) totalTokens += u.total;
        document.getElementById('usage').textContent = `${reply.model} · Input: ${u.input ?? '—'} · Output: ${u.output ?? '—'} · This reply: ${u.total ?? '—'} · Session: ${totalTokens} tokens`;
        document.getElementById('chatStatus').textContent = '';
      } catch(e) { message('error', e.message.replace(/^Error invoking remote method '[^']+': Error: /, '')); input.value = q; catController.queryReset(); document.getElementById('chatStatus').textContent = 'Not sent to conversation history. You can retry.'; }
      finally { busy = false; document.getElementById('go').disabled = false; toggle.disabled = false; document.getElementById('newChat').disabled = false; input.focus(); }
    }
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing && !e.repeat) submit();
      if (e.key === 'Escape') input.blur();
    });
    document.getElementById('go').addEventListener('click', submit);
    api.onFocusInput(() => input.focus());
  </script>
</body>

</html>
