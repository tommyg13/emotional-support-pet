<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    }

    #wrap {
      position: relative;
      width: 560px;
      height: 270px;
      -webkit-app-region: no-drag;
      user-select: none;
      transform-origin:top left; transform:scale(var(--dock-scale, 1));
    }

    #wrap.roaming #cat,#wrap.roaming #careBubble,#wrap.roaming #yarnBubble {visibility:hidden;pointer-events:none;}
    #cat {
      position: absolute;
      right: 44px;
      bottom: 88px;
      height: 190px;
      width: 157px;
      z-index: 2;
      pointer-events: auto;
      filter: drop-shadow(0 6px 10px rgba(60, 40, 30, .25));
    }

    #cat svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    #carriedCare {position:fixed;left:0;top:0;z-index:20;pointer-events:none;filter:drop-shadow(0 3px 5px #513b4440);}
    #carriedCare svg {width:100%;height:100%;display:block;}
    #carriedCare[hidden] {display:none;}
    #care,#roamCommands { position:absolute; left:36px; bottom:100px; display:flex; gap:16px; z-index:3; }
    .care-button { width:74px; height:82px; border:1px solid #fff8; border-radius:22px; background:linear-gradient(155deg,#fff8ee,#efdfd6); color:#6b5147; box-shadow:0 5px 12px #583b3226; cursor:pointer; font-family:inherit; font-size:11px; font-weight:600; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; -webkit-app-region:no-drag; }
    .care-button[hidden] {display:none;}
    .care-button svg { width:50px; height:50px; pointer-events:none; }
    .care-button[aria-pressed=true]{background:#e7d8ee;box-shadow:0 0 0 2px #b38eb666;}
    #roamCommands[hidden],#care[hidden]{display:none!important;}
    #roamCommands .care-button{width:58px;height:76px;}
    #roamCommands .care-button svg{width:38px;height:38px;}
    .care-button:hover { background:#fff5e9; }
    .care-button:active { background:#ecd5c7; }
    .care-button:focus-visible { outline:3px solid #ff5c8acc; outline-offset:3px; }
    :is(#careBubble,#yarnBubble) { position:absolute; left:32px; top:20px; width:236px; box-sizing:border-box; padding:12px 16px; border-radius:20px; background:#fff5e9; color:#705145; border:1px solid #eacbc0; box-shadow:0 4px 14px #583b3220; z-index:4; font-size:13px; line-height:1.4; overflow-wrap:anywhere; pointer-events:none; }
    :is(#careBubble,#yarnBubble)::after { content:""; position:absolute; right:-9px; bottom:14px; width:14px; height:14px; background:#fff5e9; border-right:1px solid #eacbc0; border-top:1px solid #eacbc0; transform:rotate(45deg); }
    :is(#careBubble,#yarnBubble)[hidden] { display:none; }

    #bar {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      height: 72px;
      z-index: 1;
      border-radius: 36px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px 0 30px;
      background: linear-gradient(180deg, #d9cac2, #e8dbd2);
      box-shadow: 0 8px 24px rgba(90, 60, 50, .28), inset 0 1px 2px rgba(255, 255, 255, .55);
    }

    input {
      -webkit-app-region: no-drag;
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      font-family: inherit;
      font-size: 24px;
      font-weight: 500;
      color: #4a3a36;
    }

    input::placeholder {
      color: rgba(255, 255, 255, .95);
      text-shadow: 0 1px 2px rgba(90, 60, 50, .25);
    }

    #go {
      -webkit-app-region: no-drag;
      background: none;
      border: 0;
      cursor: pointer;
      padding: 8px;
      border-radius: 12px;
    }

    #go:hover {
      background: rgba(255, 255, 255, .3);
    }

    input:focus-visible { outline:none; }
    #bar:focus-within { box-shadow:0 8px 24px rgba(90,60,50,.22), 0 0 0 4px rgba(179,142,182,.2), 0 0 20px rgba(161,123,175,.22), inset 0 1px 2px #ffffffaa; }
    #go:focus-visible { outline:none; box-shadow:0 0 0 3px #b38eb666; }
    #resizeDock { position:absolute;right:3px;bottom:1px;width:27px;height:25px;z-index:6;background:transparent;border:0;border-radius:8px;color:#967b78;cursor:ew-resize;display:grid;place-items:center;padding:3px;-webkit-app-region:no-drag; }
    #resizeDock svg {width:17px;height:17px;pointer-events:none;}
    #resizeDock:hover,#resizeDock:focus-visible {background:#fff5;outline:none;box-shadow:0 0 0 2px #b38eb655;}


    #go svg {
      width: 32px;
      height: 32px;
      display: block;
    }
    #walkToggle {border:0;background:#ffffff60;color:#745c70;border-radius:12px;padding:7px;display:grid;place-items:center;cursor:pointer;}
    #walkToggle[hidden] {display:none;}
    #walkToggle svg {width:24px;height:24px;}
    #walkToggle:focus-visible {outline:none;box-shadow:0 0 0 3px #b38eb666;}
    #aiToggle { border:0; border-radius:16px; padding:9px; cursor:pointer; color:#59433c; background:#ffffff70; white-space:nowrap; }
    #aiToggle[aria-pressed=true] { background:#ff5c8a; color:white; }
    #chat { position:absolute; top:var(--dock-height,270px); left:16px; right:16px; bottom:8px; background:#fff7f2; color:#3a2a2a; border-radius:20px; padding:14px; box-sizing:border-box; display:flex; flex-direction:column; box-shadow:0 4px 18px #5433; }
    #chat[hidden] { display:none; }
    #chat header { display:flex; gap:8px; align-items:center; }
    #chat header strong { flex:1; }
    #chat button { border:0; border-radius:10px; padding:6px 9px; cursor:pointer; background:#eeddd5; color:#3a2a2a; }
    #messages { flex:1; overflow:auto; user-select:text; padding:8px 0; }
    .message { white-space:pre-wrap; overflow-wrap:anywhere; margin:7px 0; padding:9px 12px; border-radius:12px; background:#f0e3dc; font-size:14px; }
    .message.user { background:#ffe0e9; margin-left:35px; }
    .message.error { color:#9a243f; }
    #usage, #chatStatus { font-size:12px; color:#806b64; }
  </style>
</head>

<body>
  <div id="wrap">
    <div id="cat"></div>
    <div id="care" role="group" aria-label="Care for your cat">
      <button id="giveWater" class="care-button" type="button" aria-label="Give the cat water" title="Give water"><span>Water</span></button>
      <button id="giveSnack" class="care-button" type="button" aria-label="Give the cat a fish treat" title="Give a fish treat"><span>Fish treat</span></button>
      <button id="playYarn" class="care-button" type="button" aria-label="Play with a yarn ball" title="Play with yarn"><span>Yarn</span></button>
    </div>
    <div id="roamCommands" hidden role="group" aria-label="Roaming cat commands">
      <button id="catJump" class="care-button" type="button" title="Make the roaming cat jump"><svg viewBox="0 0 48 48" fill="none" stroke="#9D78A9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 32V8m-9 9 9-9 9 9M9 37q15 9 30 0"/></svg><span>Jump</span></button>
      <button id="catSpeed" class="care-button" type="button" title="Toggle faster walking" aria-pressed="false"><svg viewBox="0 0 48 48" fill="#E8B36A" stroke="#B68444" stroke-width="2" stroke-linejoin="round"><path d="m27 4-17 23h13l-2 17 17-25H25Z"/></svg><span>Speed</span></button>
      <button id="catSit" class="care-button" type="button" title="Sit here"><svg viewBox="0 0 48 48" fill="#F3B572" stroke="#C98949" stroke-width="2" stroke-linejoin="round"><path d="m15 17 1-10 8 7 8-7 1 10q5 15-1 24H17q-6-9-2-24Z"/><path d="M33 39q13 2 9-10" fill="none" stroke-linecap="round"/><circle cx="21" cy="21" r="1" fill="#654a4a"/><circle cx="29" cy="21" r="1" fill="#654a4a"/></svg><span>Sit</span></button>
      <button id="chaseYarn" class="care-button" type="button" title="Chase a yarn ball around the screen"><span>Yarn</span></button>
    </div>
    <div id="careBubble" role="status" aria-live="polite" hidden>So happy… but I’m full! Let’s paws for a moment. ♡</div>
    <button id="resizeDock" type="button" aria-label="Resize search dock" title="Drag to resize · arrow keys adjust · double-click to reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m7 17 10-10m-5 0h5v5M7 12v5h5"/></svg></button>
    <div id="yarnBubble" role="status" aria-live="polite" hidden></div>
    <div id="bar">
      <input id="q" type="text" placeholder="Ask Something" autocomplete="off" spellcheck="false">
      <button id="go" title="Search (Enter)" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M20 5v6a2 2 0 0 1-2 2H5" />
          <path d="M9 8l-4 5 4 5" />
        </svg>
      </button>
      <button id="walkToggle" type="button" aria-label="Let the cat walk" title="Let the cat walk" aria-pressed="false"></button>
      <button id="aiToggle" aria-pressed="false" title="Turn AI chat on or off">AI OFF</button>
    </div>
  </div>
  <div id="carriedCare" hidden aria-hidden="true"></div>
  <section id="chat" hidden aria-label="AI conversation">
    <header><strong id="chatTitle">AI chat</strong><button id="aiSettings">Settings</button><button id="newChat">New chat</button><button id="closeChat" aria-label="Close conversation">×</button></header>
    <div id="messages" role="log" aria-live="polite"></div>
    <div id="chatStatus" role="status"></div><div id="usage">Tokens appear after a reply.</div>
  </section>
  <script src="typing-cat.js"></script>
  <script src="companion-life.js"></script>
<script src="companion-interaction.js"></script><script src="companion-rest.js"></script><script src="companion-idle.js"></script><script src="companion-ball.js"></script><script src="pomeranian.js"></script>
  <script src="search-character.js"></script>
  <script src="cat-name.js"></script>
  <script>
    const input = document.getElementById('q');
    const resizeHandle = document.getElementById('resizeDock');
    let resizing = null;
    function layoutDock() {
      const width = Math.max(400, Math.min(560, window.innerWidth || 560));
      document.documentElement?.style?.setProperty('--dock-scale', String(width / 560));
      document.documentElement?.style?.setProperty('--dock-height', `${Math.round(270 * width / 560)}px`);
    }
    layoutDock(); window.addEventListener('resize', layoutDock);
    function endResize() {
      if (!resizing) return;
      const id = resizing.id; resizing = null;
      if (resizeHandle.hasPointerCapture(id)) resizeHandle.releasePointerCapture(id);
      api.dockResizeEnd();
      window.dispatchEvent(new CustomEvent('cat-drag', {detail:false}));
    }
    resizeHandle.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      resizing = {id:e.pointerId, x:e.screenX, width:window.innerWidth};
      resizeHandle.setPointerCapture(e.pointerId);
      window.dispatchEvent(new CustomEvent('cat-drag', {detail:true}));
      e.preventDefault();
    });
    resizeHandle.addEventListener('pointermove', e => {
      if (resizing && resizing.id === e.pointerId) api.dockResize(Math.max(400, Math.min(560, resizing.width + e.screenX - resizing.x)));
    });
    for (const event of ['pointerup','pointercancel','lostpointercapture']) resizeHandle.addEventListener(event, endResize);
    window.addEventListener('blur', endResize);
    resizeHandle.addEventListener('dblclick', () => { api.dockResize(560); api.dockResizeEnd(); });
    resizeHandle.addEventListener('keydown', e => {
      const widths = {ArrowLeft:(window.innerWidth || 560)-20, ArrowRight:(window.innerWidth || 560)+20, Home:400, End:560};
      if (!(e.key in widths)) return;
      e.preventDefault(); api.dockResize(Math.max(400, Math.min(560, widths[e.key]))); api.dockResizeEnd();
    });
    let catRoaming = false, selectedCharacter = 'wizard-cat', currentPersonality = 'calm';
    const walkToggle=document.getElementById('walkToggle');
    function updateWalkToggle() {
      const pet=selectedCharacter==='pomeranian'?'puppy':'cat';
      const label=catRoaming?'Bring the '+pet+' home':'Let the '+pet+' walk';
      walkToggle.title=label;walkToggle.setAttribute('aria-label',label);walkToggle.setAttribute('aria-pressed',String(catRoaming));
      walkToggle.innerHTML=catRoaming?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8M5 10v11h14V10M9 21v-7h6v7"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="8" cy="15" rx="3.5" ry="5" transform="rotate(-25 8 15)"/><ellipse cx="17" cy="8" rx="3.5" ry="5" transform="rotate(-25 17 8)"/><circle cx="5" cy="8" r="1.6"/><circle cx="14" cy="2" r="1.6"/></svg>';
    }
    document.getElementById('care').hidden=false;document.getElementById('roamCommands').hidden=true;
    updateWalkToggle();
    walkToggle.onclick=async()=>{if(!SearchCharacters.predefined.find(entry=>entry.id===selectedCharacter)?.modes.includes('roaming'))return;walkToggle.disabled=true;try{if(catRoaming)await api.returnCat();else await api.releaseCat();}finally{walkToggle.disabled=false;}};
    const stopRoaming = api.onCatRoaming?.(value => {
      catRoaming=value;updateWalkToggle();document.getElementById('care').hidden=value;document.getElementById('roamCommands').hidden=!value;if(!value)document.getElementById('catSpeed').setAttribute('aria-pressed','false');
      document.getElementById('wrap').classList.toggle('roaming',value);
      endCarry();
      document.getElementById('careBubble').hidden=true;
      document.getElementById('yarnBubble').hidden=true;
    });
    input.addEventListener('input',e=>{if(catRoaming&&!e.isComposing&&input.value.trim()&&!input.value.trim().startsWith('/'))api.searchTyping();});
    input.title = 'Type /walk to release your cat, or /home to bring it back';
    window.addEventListener('beforeunload',()=>stopRoaming?.());
    let catController = SearchCharacters.mount('wizard-cat', 'docked', document.getElementById('cat'), {input});
    const carried = document.getElementById('carriedCare');
    let carry = null, holdTimer = null;
    function endCarry() {
      if (holdTimer !== null) clearTimeout(holdTimer); holdTimer = null;
      if (carry) {
        const {button,id} = carry; carry = null;
        catController.cancelManualCare();
        if (button.hasPointerCapture(id)) button.releasePointerCapture(id);
      }
      carried.hidden = true;
    }
    function moveCare(e) {
      if (!carry || !carry.active) return;
      const area = document.getElementById('wrap').getBoundingClientRect();
      if (e.clientX < area.left || e.clientX > area.right || e.clientY < area.top || e.clientY > area.bottom) { endCarry(); return; }
      carry.x = e.clientX; carry.y = e.clientY;
      const size = 48 * (window.innerWidth || 560) / 560;
      carried.setAttribute('style', `width:${size}px;height:${size}px;transform:translate(${e.clientX-size/2}px,${e.clientY-size/2}px)`);
      catController.updateManualCare(e.clientX,e.clientY);
    }
    document.getElementById('cat').addEventListener('cat-manual-care-delivered', endCarry);
    document.getElementById('cat').addEventListener('cat-manual-care-cancelled', endCarry);
    window.addEventListener('pointermove', e => {
      if (!carry || carry.id !== e.pointerId) return;
      carry.x=e.clientX;carry.y=e.clientY;moveCare(e);
    });
    window.addEventListener('pointerup', endCarry);
    window.addEventListener('pointercancel', endCarry);
    window.addEventListener('blur', endCarry);
    window.addEventListener('beforeunload', endCarry);
    for (const [id, kind] of [['giveWater', 'water'], ['giveSnack', 'snack']]) {
      const button = document.getElementById(id);
      button.insertAdjacentHTML('afterbegin', catController.icons.care[kind]);
      let suppressClick = false;
      button.title = 'Click to give, or hold and bring it to your companion';
      button.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        endCarry(); suppressClick = false;
        carry = {button,id:e.pointerId,kind,x:e.clientX,y:e.clientY,active:false};
        button.setPointerCapture(e.pointerId);
        holdTimer = setTimeout(() => {
          holdTimer = null;
          if (!carry || carry.button !== button) return;
          suppressClick = true;
          if (!catController.beginManualCare(kind)) {endCarry(); return;}
          carry.active = true; carried.innerHTML = catController.icons.care[kind]; carried.hidden = false;
          moveCare({clientX:carry.x,clientY:carry.y});
        },450);
      });

      for (const event of ['pointerup','pointercancel','lostpointercapture']) button.addEventListener(event,endCarry);
      button.addEventListener('click', () => {if (suppressClick) {suppressClick=false;return;} catController.giveCare(kind);});
    }
    document.getElementById('playYarn').insertAdjacentHTML('afterbegin', catController.icons.toy);
    document.getElementById('playYarn').addEventListener('click', () => catController.play());
    document.getElementById('chaseYarn').insertAdjacentHTML('afterbegin', catController.icons.toy);
    for(const [id,command] of [['catJump','jump'],['catSpeed','speed'],['catSit','sit'],['chaseYarn','yarn']]) {
      const button=document.getElementById(id);
      button.addEventListener('click',async()=>{
        if(!catRoaming)return;
        button.disabled=true;
        try {
          const result=await api.roamCommand(command);
          if(result?.ok&&command==='speed') {
            button.setAttribute('aria-pressed',String(result.fast));button.title=result.fast?'Fast walking · click for normal speed':'Normal walking · click for fast speed';
          }
        } finally {button.disabled=false;}
      });
    }
    const companionNames = {catName:'',puppyName:''};
    function refreshCompanionName() {
      const puppy=selectedCharacter==='pomeranian';
      const name=companionNames[puppy?'puppyName':'catName'];
      updateCatName(name);
      catController.setName(name);
      document.getElementById('care').setAttribute('aria-label','Care for '+(name||(puppy?'your puppy':'your cat')));
    }
    function updateCatName(name) {
      const label = CatName.normalize(name) || (selectedCharacter==='pomeranian'?'Your puppy':'Your cat');
      document.getElementById('careBubble').textContent = `${label} is happy—and full! Let’s paws for a moment. ♡`;
    }
    const stopCatName = api.onCatName?.(name=>{companionNames.catName=CatName.normalize(name);refreshCompanionName();});
    const stopPuppyName=api.onPuppyName?.(name=>{companionNames.puppyName=CatName.normalize(name);refreshCompanionName();});
    window.addEventListener('beforeunload',()=>stopPuppyName?.());
    document.getElementById('cat').addEventListener('cat-yarn-complete', e => {
      const bubble = document.getElementById('yarnBubble');
      bubble.textContent = e.detail.message;
      bubble.hidden = false;
    });
    document.getElementById('cat').addEventListener('cat-manual-care-complete', e => {
      const bubble = document.getElementById('yarnBubble');
      bubble.textContent = e.detail.message; bubble.hidden = false;
      document.getElementById('careBubble').hidden = true;
    });
    document.getElementById('cat').addEventListener('companion-bubble', e => {
      document.getElementById('yarnBubble').textContent=e.detail.message;document.getElementById('yarnBubble').hidden=false;
    });
    document.getElementById('cat').addEventListener('cat-yarn-quote-clear', () => {
      document.getElementById('yarnBubble').hidden = true;
    });
    document.getElementById('cat').addEventListener('cat-care-full', e => {
      document.getElementById('careBubble').hidden = !e.detail.full;
    });
    window.addEventListener('beforeunload', () => { catController.destroy(); stopCatName?.(); });
    function selectSearchCharacter(id, retry=false) {
      const definition = SearchCharacters.predefined.find(entry => entry.id === id);
      if (!definition || (id === selectedCharacter && !retry)) return;
      endCarry();catController.destroy();
      document.getElementById('cat').replaceChildren();
      selectedCharacter = id;
      catController = SearchCharacters.mount(id, 'docked', document.getElementById('cat'), {input});
      catController.setPersonality(currentPersonality);
      walkToggle.hidden = !definition.modes.includes('roaming');updateWalkToggle();
      document.getElementById('catSit').hidden=false;
      document.getElementById('catJump').title='Make your companion jump';
      document.getElementById('roamCommands').setAttribute('aria-label','Roaming companion commands');
      const chase=document.getElementById('chaseYarn');chase.querySelector('svg')?.remove();chase.insertAdjacentHTML('afterbegin',catController.icons.toy);chase.querySelector('span').textContent=id==='pomeranian'?'Ball':'Yarn';chase.title='Chase the '+(id==='pomeranian'?'ball':'yarn');
      document.getElementById('careBubble').hidden = true;
      document.getElementById('yarnBubble').hidden = true;
      for (const [buttonId,kind,label] of [['giveWater','water','Water'],['giveSnack','snack',definition.items.food==='bone'?'Bone treat':'Fish treat'],['playYarn','toy',definition.items.toy==='ball'?'Ball':'Yarn']]) {
        const button = document.getElementById(buttonId);
        button.querySelector('svg')?.remove();
        button.insertAdjacentHTML('afterbegin',kind==='toy'?catController.icons.toy:catController.icons.care[kind]);
        button.querySelector('span').textContent = label;
        button.setAttribute('aria-label',label);
        button.title = kind==='toy'?'Play with '+label.toLowerCase():catController.supports('beginManualCare')?'Click to give, or hold and bring it to your companion':'Give '+label.toLowerCase();
      }
      document.getElementById('care').setAttribute('aria-label','Care for your '+definition.name);
      refreshCompanionName();
      input.title = 'Type /walk to release your companion, or /home to bring it back';
    }
    document.getElementById('cat').addEventListener('character-retry',()=>{if(selectedCharacter==='pomeranian')selectSearchCharacter(selectedCharacter,true);});
    const stopSearchCharacter = api.onSearchCharacter?.(selectSearchCharacter);
    window.addEventListener('beforeunload',()=>stopSearchCharacter?.());
    api.getSettings().then(s => { currentPersonality=s.catPersonality||'calm';selectSearchCharacter(s.searchCharacter||'wizard-cat');catController.setPersonality(currentPersonality);companionNames.catName=CatName.normalize(s.catName);companionNames.puppyName=CatName.normalize(s.puppyName);refreshCompanionName(); }).catch(() => {});
    api.onCatPersonality(value => { currentPersonality=value;catController.setPersonality(value); });
    const stopDevCatAction=api.onDevCatAction(async (action, value) => {
      if(action==='puppy') {
        if(selectedCharacter!=='pomeranian'||!['idle','welcome','water','snack','play','sit','sleep','wake','blink'].includes(value))return;
        const controller=catController;
        if(!await controller.ready||controller!==catController||controller.destroyed)return;
        if(value==='water'||value==='snack')controller.giveCare(value);
        else if(value==='play')controller.play();
        else if(value==='sit'||value==='sleep'||value==='wake'||value==='blink')controller[value]();
        else controller.react(value);
        return;
      }
      if(action==='mood'||action==='wave')window.dispatchEvent(new CustomEvent(action==='mood'?'cat-dev-mood':'cat-dev-wave',{detail:value}));
    });
    window.addEventListener('beforeunload',()=>stopDevCatAction?.());

    // Explicit capture gives the animation reliable press/release state during window dragging.
    const wrap = document.getElementById('wrap');
    let drag = null;
    function endDrag(e) {
      if (!drag) return;
      const id = drag.id;
      drag = null;
      if (wrap.hasPointerCapture(id)) wrap.releasePointerCapture(id);
      api.dockDragEnd();
      window.dispatchEvent(new CustomEvent('cat-drag', { detail: false }));
    }
    wrap.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || e.target.closest('input, button')) return;
      drag = { id: e.pointerId, x: e.screenX, y: e.screenY };
      wrap.setPointerCapture(e.pointerId);
      window.dispatchEvent(new CustomEvent('cat-drag', { detail: true }));
      api.dockDragStart();
      e.preventDefault();
    });
    wrap.addEventListener('pointermove', (e) => {
      if (drag && e.pointerId === drag.id) api.dockDragMove(e.screenX - drag.x, e.screenY - drag.y);
    });
    wrap.addEventListener('pointerup', endDrag);
    wrap.addEventListener('pointercancel', endDrag);
    wrap.addEventListener('lostpointercapture', endDrag);
    window.addEventListener('blur', endDrag);

    let enabled = false, busy = false, provider = '', activeModel = '', history = [], totalTokens = 0;
    const panel = document.getElementById('chat'), toggle = document.getElementById('aiToggle');
    async function showPanel(open) { panel.hidden = !open; await api.aiPanel(open); }
    function message(role, text) {
      const el = document.createElement('div'); el.className = 'message ' + role; el.textContent = text;
      document.getElementById('messages').appendChild(el); el.scrollIntoView({ block:'end' });
    }
    async function refresh() {
      const s = await api.getSettings();
      companionNames.catName=CatName.normalize(s.catName);companionNames.puppyName=CatName.normalize(s.puppyName);refreshCompanionName();
      const nextModel = s.aiModels?.[s.aiProvider] || '';
      if (provider && (provider !== s.aiProvider || activeModel !== nextModel)) reset();
      activeModel = nextModel;
      provider = s.aiProvider || 'openai'; enabled = !!s.aiEnabled;
      toggle.textContent = enabled ? 'AI ON' : 'AI OFF'; toggle.setAttribute('aria-pressed', String(enabled));
      document.getElementById('chatTitle').textContent = 'AI chat · ' + ({openai:'OpenAI',claude:'Claude',google:'Google Gemini'}[provider]);
      input.placeholder = enabled ? 'Ask AI…' : 'Ask Something';
      if (!enabled && !panel.hidden) await showPanel(false);
    }
    function reset() { history = []; totalTokens = 0; document.getElementById('messages').replaceChildren(); document.getElementById('usage').textContent = 'Tokens appear after a reply.'; document.getElementById('chatStatus').textContent = ''; }
    toggle.onclick = async () => {
      if (busy) return;
      await api.setSettings({ aiEnabled: !enabled }); await refresh();
      if (enabled && !(await api.aiStatus(provider)).configured) {
        await showPanel(true); document.getElementById('chatStatus').textContent = 'Choose a provider, save your API key and select an official model in Settings.';
      }
    };
    document.getElementById('aiSettings').onclick = () => api.openSettings();
    document.getElementById('newChat').onclick = () => { if (!busy) reset(); };
    document.getElementById('closeChat').onclick = () => showPanel(false);
    window.addEventListener('focus', () => { if (!busy) refresh(); });
    refresh();
    async function submit() {
      const q = input.value.trim();
      if (/^\/(walk|home)$/i.test(q)) {
        if(!SearchCharacters.predefined.find(entry=>entry.id===selectedCharacter)?.modes.includes('roaming'))return;
        const command=q.toLowerCase();
        try {
          const ok=command==='/walk'?await api.releaseCat():await api.returnCat();
          if(ok){input.value='';catController.queryReset();}
        } catch { input.title='Could not release the cat. Please try again.'; }
        return;
      }
      if (!q || busy) return;
      await refresh();
      if (!enabled) { api.searchSubmit(q); input.value = ''; catController.searchCompleted(); return; }
      await showPanel(true);
      if (!(await api.aiStatus(provider)).configured || !activeModel) {
        document.getElementById('chatStatus').textContent = 'Choose a provider, save your API key and select an official model in Settings.'; return;
      }
      if (q.length > 30000 || history.length >= 98) { document.getElementById('chatStatus').textContent = 'Message or conversation too long. Start a new chat.'; return; }
      busy = true; document.getElementById('go').disabled = true; toggle.disabled = true;
      document.getElementById('newChat').disabled = true; input.value = ''; catController.queryReset(); message('user', q);
      document.getElementById('chatStatus').textContent = 'Thinking…';
      const messages = [...history, {role:'user', content:q}];
      try {
        const reply = await api.aiChat(messages);
        history = [...messages, {role:'assistant',content:reply.text}]; message('assistant', reply.text);
        catController.searchCompleted();
        const u = reply.usage; if (u.total != null) totalTokens += u.total;
        document.getElementById('usage').textContent = `${reply.model} · Input: ${u.input ?? '—'} · Output: ${u.output ?? '—'} · This reply: ${u.total ?? '—'} · Session: ${totalTokens} tokens`;
        document.getElementById('chatStatus').textContent = '';
      } catch(e) { message('error', e.message.replace(/^Error invoking remote method '[^']+': Error: /, '')); input.value = q; catController.queryReset(); document.getElementById('chatStatus').textContent = 'Not sent to conversation history. You can retry.'; }
      finally { busy = false; document.getElementById('go').disabled = false; toggle.disabled = false; document.getElementById('newChat').disabled = false; input.focus(); }
    }
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing && !e.repeat) submit();
      if (e.key === 'Escape') input.blur();
    });
    document.getElementById('go').addEventListener('click', submit);
    api.onFocusInput(() => input.focus());
  </script>
</body>

</html>
