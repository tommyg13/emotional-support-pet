<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;user-select:none}#chaseYarn{position:fixed;width:34px;height:34px;pointer-events:none;transform:translate(-50%,-50%);z-index:99999;filter:drop-shadow(0 3px 4px #654a4a33)}#chaseYarn[hidden]{display:none}#tip{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#fff4e7e8;color:#654a4a;padding:9px 15px;border-radius:18px;font:13px system-ui;pointer-events:none;transition:opacity .5s} @media(prefers-reduced-motion:reduce){#chaseYarn{position:fixed;width:34px;height:34px;pointer-events:none;transform:translate(-50%,-50%);z-index:99999;filter:drop-shadow(0 3px 4px #654a4a33)}#chaseYarn[hidden]{display:none}#tip{transition:none}}
</style></head><body><div id="tip">Click me to go home · drag to pick me up by the scruff</div><div id="chaseYarn" hidden aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" fill="#C6A0D8" stroke="#886399" stroke-width="3"/><g fill="none" stroke="#F1DFF5" stroke-width="3"><path d="M13 17q20 4 35 27M9 29q18 1 30 25M24 9q20 9 30 26M17 49q5-21 28-35M27 54q4-20 27-30"/></g></svg></div><script src="walking-cat.js"></script><script>
const params=new URLSearchParams(location.search),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let alive=true,returning=false,chaseId=0;
const yarn=document.getElementById('chaseYarn');
function stopChase(){chaseId++;yarn.hidden=true;yarn.getAnimations().forEach(animation=>animation.cancel());}
async function chaseYarn(){
 stopChase();const id=chaseId;yarn.hidden=false;
 let p=cat.getPosition();
 for(let i=0;i<6&&alive&&!returning&&id===chaseId;i++){
  const target={x:110+Math.random()*Math.max(1,innerWidth-220),y:160+Math.random()*Math.max(1,innerHeight-190)};
  yarn.style.left=target.x+'px';yarn.style.top=target.y+'px';
  if(!reduce){const roll=yarn.animate([{translate:`${p.x-target.x}px ${p.y-target.y}px`,rotate:'0deg'},{translate:'0px 0px',rotate:'360deg'}],{duration:650,easing:'ease-out'});try{await roll.finished;}catch{}}
  if(id!==chaseId||!alive||returning)break;
  const arrived=await cat.walkTo(target.x,target.y,{run:true});if(!arrived)break;cat.jump();p=target;
  await new Promise(resolve=>setTimeout(resolve,700));
 }
 if(id===chaseId)yarn.hidden=true;
}
const cat=WalkingCat.mount(document.body,{x:Number(params.get('x'))||innerWidth/2,y:Number(params.get('y'))||innerHeight*.7,scale:.72,minDepth:.8,desktop:true,reducedMotion:reduce,onClick:()=>api.returnCat(),onHeld:held=>{api.roamHeld(held);if(held)stopChase();}});
const stopTarget=api.onRoamTarget(point=>{if(alive&&!returning&&!cat.isHeld()){clearTimeout(firstWalk);stopChase();cat.walkTo(point.x,point.y);}});
const stopHome=api.onRoamHome(async point=>{
 if(returning||!alive)return;clearTimeout(firstWalk);stopChase();returning=true;cat.drop();
 document.getElementById('tip').textContent='Coming home!';document.getElementById('tip').style.opacity='1';
 const arrived=await cat.walkTo(point.x,point.y,{run:true,home:true});
 if(!alive)return;
 if(arrived)api.roamHomeArrived();else{api.roamHomeCancelled();returning=false;document.getElementById('tip').style.opacity='0';}
});
const stopCommand=api.onRoamCommand(({command,fast})=>{
 if(!alive||returning||cat.isHeld())return;clearTimeout(firstWalk);
 if(command==='speed'){cat.setSpeed(fast?1.8:1);return;}
 stopChase();cat.stop();
 if(command==='jump')cat.jump();
 if(command==='sit')cat.sit();
 if(command==='yarn')chaseYarn();
});
const stopClicks=api.onRoamClicks(enabled=>{if(!enabled){document.getElementById('tip').textContent='Click me or the Home button to return · drag to move me · enable Accessibility for desktop-click navigation';}});
const timer=setInterval(()=>{
 if(!alive)return;
 const r=cat.element.querySelector('svg').getBoundingClientRect();
 api.roamHit({x:r.left,y:r.top,width:r.width,height:r.height});
},100);
// One short exploration, then the existing idle timer naturally sits and sleeps.
const firstWalk=setTimeout(()=>{if(alive&&!returning&&!cat.isHeld()&&!reduce)cat.walkTo(110+Math.random()*Math.max(1,innerWidth-220),160+Math.random()*Math.max(1,innerHeight-190));},2200);
const tipTimer=setTimeout(()=>document.getElementById('tip').style.opacity='0',7000);
window.addEventListener('beforeunload',()=>{alive=false;stopChase();clearInterval(timer);clearTimeout(firstWalk);clearTimeout(tipTimer);stopTarget();stopHome();stopClicks();stopCommand();cat.destroy();});
</script></body></html>
