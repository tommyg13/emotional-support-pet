<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:system-ui,sans-serif;color:#513b44}
#panel{position:absolute;inset:12px 10px 8px;box-sizing:border-box;padding:16px 18px;border-radius:24px;background:#fff3ed;box-shadow:0 8px 28px #513b443b;text-align:center;border:2px solid #f5c9cc}
#cat{display:block;object-fit:contain;width:180px;height:180px;margin:-8px auto 0;filter:drop-shadow(0 6px 7px #73503d33)}
h1{font-size:19px;margin:0;overflow-wrap:anywhere}p{font-size:13px;line-height:1.5;margin:8px 0 12px;min-height:39px;overflow-wrap:anywhere}
button{border:0;border-radius:14px;background:#efadc0;color:#53313e;padding:10px 12px;cursor:pointer;font:600 12px system-ui,sans-serif}
button:focus-visible{outline:3px solid #9469ae;outline-offset:3px}
#close{position:absolute;right:12px;top:12px;border-radius:50%;padding:5px 10px;background:#f5d9dc}
#snooze{background:#f5d9dc}#actions{display:flex;justify-content:center;gap:8px}
#countdown{margin:8px 0;font-size:13px;font-variant-numeric:tabular-nums}
progress{display:block;width:100%;height:7px;margin-top:6px;accent-color:#b183b8}
[hidden]{display:none!important}
</style></head><body>
<section id="panel" aria-labelledby="title">
<button id="close" aria-label="Close reminder">×</button>
<img id="cat" src="assets/stretch-cat.webp" alt="Cat stretching" width="180" height="180">
<h1 id="title">Time for a little stretch? 🐾</h1>
<p id="message" role="status">Take a gentle 20-second pause with your cat.</p>
<div id="countdown" hidden><span id="seconds" role="timer" aria-live="off">20 seconds</span><progress id="progress" max="20" value="0" aria-label="Stretch progress"></progress></div>
<div id="actions"><button id="start">Let’s stretch</button><button id="done" hidden>Back to it ♡</button><button id="snooze">Not now · 15 min</button></div>
</section>
<script src="cat-name.js"></script>
<script>
let catName = '';
let timer = null, deadline = 0, state = 'ready';
const $ = id => document.getElementById(id);
function updateCatName(name) {
  catName = CatName.normalize(name);
  if (state === 'ready') $('message').textContent = catName ? `${catName} thinks it’s stretch time. Take a gentle 20-second pause together.` : 'Take a gentle 20-second pause with your cat.';
  if (state === 'stretching') $('title').textContent = `Stretch with ${catName || 'your cat'}`;
  if (state === 'done') $('message').textContent = `A little pause, a little more energy. ${catName || 'Your cat'} approves. ♡`;
}
const stopNameListener = api.onCatName?.(updateCatName);
if (api.getSettings) api.getSettings().then(s => updateCatName(s.catName)).catch(() => {});
function stopTimer() { if (timer !== null) clearInterval(timer); timer = null; }
function tick() {
  const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
  $('seconds').textContent = `${remaining} ${remaining === 1 ? 'second' : 'seconds'}`;
  $('progress').value = 20 - remaining;
  if (remaining === 0) {
    stopTimer(); state = 'done';
    $('title').textContent = 'Nice—welcome back!';
    $('message').textContent = `A little pause, a little more energy. ${catName || 'Your cat'} approves. ♡`;
    $('done').hidden = false;
  }
}
function startStretch() {
  if (state !== 'ready') return;
  state = 'stretching'; deadline = Date.now() + 20000;
  $('title').textContent = `Stretch with ${catName || 'your cat'}`;
  $('message').textContent = 'Relax your shoulders and stretch gently at your own pace.';
  $('start').hidden = true; $('countdown').hidden = false;
  tick(); timer = setInterval(tick, 250);
}
function dismiss(snooze) { stopTimer(); api.dismissBreak(snooze); }
$('start').onclick = startStretch;
$('done').onclick = () => dismiss(false);
$('close').onclick = () => dismiss(true);
$('snooze').onclick = () => dismiss(true);
const stopStartListener = api.onStartStretch?.(startStretch);
window.addEventListener('beforeunload', () => { stopTimer(); stopStartListener?.(); stopNameListener?.(); });
if (new URLSearchParams(location.search).get('stretch') === '1') startStretch();
</script></body></html>
