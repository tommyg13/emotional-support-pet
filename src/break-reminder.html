<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:system-ui,sans-serif;color:#513b44}
#panel{position:absolute;inset:12px 10px 8px;border-radius:24px;background:#fff3ed;box-shadow:0 8px 28px #513b443b;text-align:center;border:2px solid #f5c9cc}
#cat{width:205px;height:205px;margin:-8px auto -12px;filter:drop-shadow(0 6px 7px #73503d33)}
strong{font-size:19px}p{font-size:13px;margin:6px 15px 14px}
button{border:0;border-radius:14px;background:#efadc0;color:#53313e;padding:10px 16px;cursor:pointer;font-weight:650}
#close{position:absolute;right:12px;top:12px;border-radius:50%;padding:5px 10px;background:#f5d9dc}
@media(prefers-reduced-motion:no-preference){#cat{animation:bounce 3s ease-in-out infinite}@keyframes bounce{50%{transform:translateY(-9px) rotate(2deg)}}}
</style></head><body><div id="panel"><button id="close" aria-label="Close reminder">×</button><div id="cat"></div><strong>Time for a little stretch? 🐾</strong><p>You've been working hard. Your cat wants a break!</p><button id="snooze">Not now · 15 min</button></div>
<script src="typing-cat.js"></script><script>
// Reuse the exact existing wizard-cat SVG, without replacing its artwork.
const cat=document.getElementById('cat');
const source=TypingCat.mount(cat,document.createElement('input'));
document.getElementById('close').onclick=()=>api.dismissBreak(true);
document.getElementById('snooze').onclick=()=>api.dismissBreak(true);
window.addEventListener('beforeunload',()=>source.destroy());
</script></body></html>
